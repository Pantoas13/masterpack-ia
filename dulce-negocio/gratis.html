<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratis: Receta gratis: Carlota de limón sin horno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --c1:#7C2D12; --c2:#9A3412; --accent:#F97316; --accent2:#EA580C; --soft:#FFF7ED;
            --text:#1E293B; --muted:#64748B; --border:#E2E8F0; --bg:#F8FAFC; --white:#FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--white); line-height: 1.6; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; line-height: 1.2; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .center { text-align: center; }
        .btn { display: inline-block; background: var(--accent); color: #fff; font-size: 1.15rem; font-weight: 700; padding: 17px 36px; border-radius: 10px; text-decoration: none; transition: all .2s; box-shadow: 0 10px 18px -6px rgba(0,0,0,.35); border: none; cursor: pointer; }
        .btn:hover { background: var(--accent2); transform: translateY(-2px); }
        body { background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .card { background: #fff; max-width: 540px; width: 100%; border-radius: 20px; padding: 38px 28px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,.45); }
        .tag { display: inline-block; background: var(--soft); color: var(--accent2); padding: 6px 14px; border-radius: 20px; font-size: .85rem; font-weight: 700; margin-bottom: 14px; }
        h1 { font-size: 1.65rem; color: var(--c1); margin-bottom: 12px; }
        p.lead { color: var(--muted); margin-bottom: 24px; }
        .fg { text-align: left; margin-bottom: 14px; }
        label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        input[type=text], input[type=email] { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; margin-top: 8px; }
        .btn:disabled { opacity: .6; cursor: wait; }
        .msg { margin-top: 12px; font-weight: 600; color: #DC2626; min-height: 1em; }
        .small { font-size: .78rem; color: var(--muted); margin-top: 14px; }
        .back { display: inline-block; margin-top: 16px; font-size: .9rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">🎁 GRATIS</span>
        <h1>Receta gratis: Carlota de limón sin horno</h1>
        <p class="lead">La receta completa con costo por vaso y precio sugerido, para que pruebes a vender hoy mismo. Escribe tu nombre y correo y descárgalo al instante.</p>
        <form id="lead-form">
            <div class="fg"><label for="nombre">Tu nombre</label><input id="nombre" name="fields[name]" type="text" placeholder="Ej: Ana" autocomplete="given-name" required></div>
            <div class="fg"><label for="email">Tu correo</label><input id="email" name="fields[email]" type="email" placeholder="ejemplo@correo.com" autocomplete="email" required></div>
            <input type="hidden" name="ml-submit" value="1"><input type="hidden" name="anticsrf" value="true">
            <button type="submit" class="btn" id="btn-enviar">Quiero la receta gratis</button>
            <p class="msg" id="form-msg" role="status"></p>
        </form>
        <p class="small">🔒 Cero spam. Te puedes dar de baja con un clic.</p>
        <a class="back" href="index.html">Ver el producto completo</a>
    </div>
    <script src="config.js"></script>
    <script>
        const form = document.getElementById('lead-form'), msg = document.getElementById('form-msg'), btn = document.getElementById('btn-enviar'), label = btn.textContent;
        form.addEventListener('submit', async function (ev) {
            ev.preventDefault(); msg.textContent = '';
            const action = (window.SITE_CONFIG || {}).MAILERLITE_ACTION;
            if (!action) { location.href = 'gracias.html'; return; }
            btn.disabled = true; btn.textContent = 'Enviando...';
            try {
                const res = await fetch(action, { method: 'POST', body: new FormData(form) });
                const data = await res.json().catch(() => ({}));
                if (data.success === false) throw new Error('correo');
                location.href = 'gracias.html';
            } catch (err) {
                if (err.message !== 'correo') { location.href = 'gracias.html'; return; }
                msg.textContent = 'No se pudo registrar tu correo. Revisa que esté bien escrito.';
                btn.disabled = false; btn.textContent = label;
            }
        });
    </script>
</body>
</html>
